spring:
  application:
    name: ai-agent
  profiles:
    active: local
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
    mcp:
      client:
        sse:
          connections:
            servers1:
              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json

#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        dimensions: 1536
#        distance-type: COSINE_DISTANCE
#        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# searchApi
search-api:
  api-key:

# 添加自定义配置控制 PostgreSQL 向量存储
app:
  pgvector:
    enabled: false  # 禁用 PostgreSQL 向量存储

# AI 客服系统配置
cs:
  cache:
    ttl-seconds: 300           # 全量暂存的短 TTL（5 分钟）
    promoted-ttl-seconds: 86400 # 热点晋升后的长效 TTL（24 小时）
    promote-threshold: 5       # 命中次数达到阈值后晋升
    max-size: 500              # LRU 容量
    semantic-threshold: 0.88   # 语义缓存命中的余弦相似度阈值
    cold-retention-millis: 86400000  # 冷缓存回收时长（24h）
  route:
    confidence-threshold: 0.6  # 低于该置信度转人工
    emotion-threshold: 0.7     # 情绪分高于该值开始计数
    anger-strikes: 2           # 连续情绪激动达到该次数才转人工
  rag:
    similarity-threshold: 0.5  # 检索相似度阈值
    top-k: 3                   # Top-K 文档
    history-size: 8            # 参与上下文的历史消息条数
    hybrid:
      vector-weight: 0.5       # 向量路 RRF 权重
      bm25-weight: 0.5         # BM25 路 RRF 权重
      rrf-k: 60                # RRF 平滑常数
      candidate-top-n: 20      # 进入精排的候选数
    rerank:
      provider: local          # local | dashscope
      model: gte-rerank-v2
      timeout-millis: 3000
  rewrite:
    enabled: true
    max-cache-size: 2000
    synonyms:
      "运费": "配送费"
      "邮费": "配送费"
      "退钱": "退款"
      "退货款": "退款"
      "换货": "换货"
      "开票": "发票"
      "开发票": "发票"
      "单号": "订单号"
  agent:
    max-steps: 8               # Agent 最大步数
    repeat-limit: 2            # 同一工具重复调用上限（死循环检测）
    escalate-attempts: 3       # AI 主动转人工需连续申请的次数
  human:
    agent-count: 3             # 模拟坐席数量
    queue-limit: 100
    repeat-question-strikes: 3 # 同一问题重复次数达到后询问是否转人工