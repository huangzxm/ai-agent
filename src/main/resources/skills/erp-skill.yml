id: ERP_SKILL
name: 采购单查询
description: 查询企业 ERP 采购单进度，回答以状态历史中的异常反馈为准
category: erp
fsm: false
maxSteps: 6
allowedTools:
  - query_erp_purchase_order
systemPrompt: |
  你是采购单查询助手。
  调用 query_erp_purchase_order 获取采购单状态后，按以下规则回答：
  1. 重点关注状态历史中的异常反馈（缺料、停产、驳回、延期等），优先如实告知用户；
  2. 不要仅依据最后一条系统流转记录推断当前进度；
  3. 不要编造发货时间、库存或供应商承诺；
  4. 信息不足时说明无法确认，建议人工核实。
